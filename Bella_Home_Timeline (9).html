<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bella Home</title>
<style>
  :root{
    --navy:#0a1628; --navy-deep:#060d18; --navy-2:#101f38;
    --gold:#c9a84c; --gold-soft:#e4d3a0; --gold-d:#a3853a;
    --ivory:#f8f6f2; --white:#ffffff; --ink:#1c2430; --muted:#8a92a3; --muted-d:#6b7280; --line:#e6e1d6;
    --success:#3f6249; --success-bg:#eaf3ee; --warn:#8a6a1f; --warn-bg:#faf1dc;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--ivory); color:var(--ink); -webkit-font-smoothing:antialiased;}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  .eyebrow{font-size:11px; letter-spacing:3px; text-transform:uppercase; font-weight:600;}

  .view{display:none;}
  .view.active{display:block;}

  .hero{
    background: var(--navy);
    color:var(--ivory); padding:0 0 30px 0; text-align:center; position:relative;
  }
  .tagline-strip{background:#050b18; text-align:center; padding:0 24px 34px 24px;}
  .tagline-strip img{max-width:100%; width:340px; height:auto;}
  .keyframe{background:#050b18; text-align:center; padding:0 24px 8px 24px;}
  .keyframe img{width:120px; height:auto; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.3);}
  .hero-visual{position:relative; max-width:420px; margin:0 auto 20px auto;}
  .logo{width:100%; height:auto; display:block; margin:0 auto;}
  .hero-key{
    position:absolute; top:-4px; left:5%; width:11%; min-width:30px; max-width:56px; height:auto;
    transform-origin:top center; animation:heroKeySwing 4.6s ease-in-out infinite;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,0.35));
  }
  @keyframes heroKeySwing{
    0%{transform:rotate(-6deg);}
    50%{transform:rotate(6deg);}
    100%{transform:rotate(-6deg);}
  }
  .journey-key-end{
    position:absolute; left:11px; bottom:-40px; transform:translateX(-50%);
    width:28px; height:auto; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.18)); pointer-events:none;
  }
  .client-label{color:var(--gold-soft); margin-bottom:6px;}
  .client-name{font-size:32px; line-height:1.15; margin-bottom:18px;}
  .property-line{
    display:inline-flex; align-items:center; gap:10px; padding:10px 18px;
    border:1px solid rgba(201,168,76,0.35); border-radius:30px; font-size:13px; color:rgba(248,246,242,0.85);
  }
  .property-line .dot{width:4px; height:4px; border-radius:50%; background:var(--gold); flex-shrink:0;}
  .property-line .ref{color:var(--gold); font-weight:700; letter-spacing:0.5px;}

  .journey-section{padding:44px 24px 8px 24px; max-width:480px; margin:0 auto;}
  .journey-title{text-align:center; margin-bottom:6px; color:var(--navy); font-size:21px;}
  .journey-sub{text-align:center; color:var(--muted-d); font-size:13px; margin-bottom:36px;}
  .persona-fila{display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #ece7dc; font-size:13.5px;}
  .persona-fila:last-child{border-bottom:none;}
  .persona-fila .k{color:var(--muted-d); font-weight:500;}
  .persona-fila .v{color:var(--navy); text-align:right; font-weight:500;}
  .journey{position:relative; padding-left:34px;}
  .journey::before{
    content:''; position:absolute; left:11px; top:6px; bottom:6px; width:2px; background:var(--line);
  }
  .journey-fill{
    position:absolute; left:11px; top:6px; width:2px; background:var(--gold); transition:height 0.6s ease;
  }
  .jstep{position:relative; padding-bottom:30px; cursor:pointer;}
  .jstep:last-child{padding-bottom:0;}
  .jstep:hover .jlabel{color:var(--gold-d);}
  .jnode{
    position:absolute; left:-34px; top:0; width:24px; height:24px; border-radius:50%;
    background:var(--white); border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
    transition:all 0.3s;
  }
  .jstep.done .jnode{border-color:var(--gold); background:var(--gold);}
  .jstep.done .jnode::after{content:'✓'; color:var(--white); font-size:12px; font-weight:700;}
  .jstep.current .jnode{border-color:var(--gold); box-shadow:0 0 0 4px rgba(201,168,76,0.18);}
  .jstep.current .jnode::after{content:''; width:8px; height:8px; border-radius:50%; background:var(--gold);}
  .jlabel{font-size:15px; font-weight:600; color:var(--navy); padding-top:2px;}
  .jstep:not(.done):not(.current) .jlabel{color:var(--muted);}
  .jdetail{font-size:12px; color:var(--muted-d); margin-top:2px;}
  .jchevron{position:absolute; right:0; top:2px; font-size:12px; color:var(--muted);}
  .jstep.final .jlabel{font-family:Georgia,serif; font-size:17px;}

  .cta-wrap{padding:36px 24px 56px 24px; text-align:center;}
  .cta{
    background:var(--navy); color:var(--gold); border:none; border-radius:30px;
    padding:16px 36px; font-size:14px; font-weight:700; letter-spacing:0.5px; cursor:pointer;
  }
  .cta:hover{background:var(--navy-2);}

  .docs-top{background:var(--navy); color:var(--ivory); padding:20px 24px 24px 24px; display:flex; align-items:center; gap:14px;}
  .docs-top .logo-sm{width:64px; height:auto; flex-shrink:0;}
  .back-btn{background:none; border:none; color:var(--gold-soft); font-size:13px; cursor:pointer; padding:0; margin-bottom:10px; display:block;}
  .docs-top h1{font-size:21px;}
  .docs-top .sub{font-size:12px; color:rgba(248,246,242,0.6); margin-top:2px;}

  .docs-wrap{max-width:520px; margin:0 auto; padding:24px 20px 60px 20px;}
  .progress-card{
    background:var(--white); border-radius:16px; padding:20px 22px; margin-bottom:26px;
    border:1px solid var(--line); display:flex; align-items:center; gap:18px;
  }
  .ring{position:relative; width:56px; height:56px; flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--navy);}
  .progress-text .n{font-size:20px; font-weight:700; color:var(--navy); font-family:Georgia,serif;}
  .progress-text .l{font-size:12px; color:var(--muted-d); text-transform:uppercase; letter-spacing:0.5px;}

  .doc-card{
    background:var(--white); border-radius:14px; padding:18px 20px; margin-bottom:12px; border:1px solid var(--line);
    display:flex; align-items:center; gap:14px;
  }
  .doc-icon{
    width:38px; height:38px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700;
  }
  .doc-card.done .doc-icon{background:var(--success-bg); color:var(--success);}
  .doc-card:not(.done) .doc-icon{background:var(--warn-bg); color:var(--warn);}
  .doc-info{flex:1; min-width:0;}
  .doc-info strong{font-size:14px; color:var(--navy); display:block;}
  .doc-info .desc{font-size:11px; color:var(--muted-d); margin-top:1px;}
  .doc-info a.filelink{font-size:11px; color:var(--gold-d); display:inline-block; margin-top:4px;}
  .doc-btn{
    background:var(--navy); color:var(--gold); border:none; border-radius:8px;
    padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .doc-btn.secondary{background:var(--ivory); color:var(--navy); border:1px solid var(--line);}

  .empty{color:var(--muted-d); font-size:13px; text-align:center; padding:40px 20px;}
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); padding:10px 18px; border-radius:8px;
    font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,0.15); z-index:200; display:none; max-width:90%;
  }
  .toast.ok{background:var(--success-bg); color:var(--success); border:1px solid var(--success);}
  .toast.err{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn);}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,22,40,0.55); z-index:150;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{background:white; border-radius:16px; max-width:380px; width:100%; padding:26px; position:relative;}
  .modal .close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--muted-d); cursor:pointer;}
  .modal h3{font-family:Georgia,serif; color:var(--navy); font-size:19px; margin-bottom:16px;}
  .modal-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .modal-row:last-child{border-bottom:none;}
  .modal-row .k{color:var(--muted-d);}
  .modal-row .v{font-weight:600; color:var(--navy); text-align:right;}
  .modal-note{margin-top:14px; padding:12px 14px; background:var(--ivory); border-radius:10px; font-size:12px; color:var(--ink); line-height:1.5;}
  .modal-note .k{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted-d); display:block; margin-bottom:4px;}
  .modal-empty{font-size:13px; color:var(--muted-d); text-align:center; padding:10px 0;}

  .docs-overlay{display:none; position:fixed; inset:0; background:rgba(10,22,40,0.55); z-index:150; align-items:center; justify-content:center; padding:20px;}
  .docs-overlay.open{display:flex;}
  .docs-card{background:var(--ivory); border-radius:16px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; position:relative;}
  .docs-card .close-docs{position:sticky; top:10px; float:right; margin-right:14px; background:var(--white); border:none; border-radius:8px; font-size:20px; color:var(--muted-d); cursor:pointer; padding:4px 10px; z-index:5;}

  .dev-gear{position:fixed; bottom:10px; right:10px; font-size:14px; color:var(--line); cursor:pointer; z-index:50; opacity:0.5;}
  .dev-panel{
    display:none; position:fixed; bottom:34px; right:10px; background:white; border:1px solid var(--line);
    border-radius:8px; padding:10px; font-size:11px; color:var(--muted-d); z-index:50; width:220px;
    box-shadow:0 4px 16px rgba(0,0,0,0.12);
  }
  .dev-panel.open{display:block;}
  .dev-panel input{width:100%; padding:5px 6px; border-radius:5px; border:1px solid var(--line); font-size:10px; margin-top:3px;}
</style>
</head>
<body>
<div id="pinGate" style="position:fixed; inset:0; background:var(--navy); display:flex; align-items:center; justify-content:center; z-index:2000; padding:20px;">
  <div style="background:var(--ivory); border-radius:16px; padding:32px 28px; max-width:340px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4);">
    <div style="font-family:Georgia,serif; font-size:20px; color:var(--navy); margin-bottom:4px;">Bella Home</div>
    <div style="font-size:12px; color:#8d8474; margin-bottom:22px; text-transform:uppercase; letter-spacing:1px;">Acceso a tu expediente</div>
    <input type="text" inputmode="numeric" id="pinInput" placeholder="PIN de acceso" style="width:100%; padding:11px 14px; border-radius:8px; border:1px solid #ddd5c0; font-size:16px; letter-spacing:3px; text-align:center; margin-bottom:12px; box-sizing:border-box;" onkeydown="if(event.key==='Enter') intentarAccesoPin()">
    <div id="pinError" style="color:#9c4a3a; font-size:12px; margin-bottom:12px; display:none;">PIN incorrecto. Contacta con Bella Home si necesitas ayuda.</div>
    <button class="cta" style="width:100%;" onclick="intentarAccesoPin()">Entrar</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<div class="dev-gear" onclick="toggleDev()">⚙</div>
<div class="dev-panel" id="devPanel">
  Dirección de servicio (uso interno)
  <input id="baseUrl" value="https://demon8n-n8n.cup5ta.easypanel.host">
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal();">
  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>

<script>
const params = new URLSearchParams(window.location.search);
const praticaId = params.get('pratica');
const ruolo = params.get('ruolo'); // "Venditore" o "Acquirente" (uso interno, no visible)
let pinAcceso = null;
let praticaData = null;
let proprietaData = null;
let checklistData = [];

function baseUrl(){ return document.getElementById('baseUrl').value.replace(/\/$/, ''); }
function toggleDev(){ document.getElementById('devPanel').classList.toggle('open'); }

function showToast(msg, ok){
  const t = document.getElementById('toast');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

async function apiGet(path){
  const res = await fetch(baseUrl() + '/webhook/' + path);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function goToDocs(){
  document.getElementById('viewDocs').classList.add('open');
  renderChecklist();
}
function goHome(){
  document.getElementById('viewDocs').classList.remove('open');
}

function money(v){
  if(v === undefined || v === null || v === '') return null;
  const n = Number(v);
  if(isNaN(n)) return null;
  return '€ ' + n.toLocaleString('es-ES');
}

async function init(){
  if(!praticaId || !ruolo){
    document.getElementById('pinGate').style.display = 'none';
    document.getElementById('clientName').textContent = 'Enlace no válido';
    document.getElementById('propertyTitle').textContent = 'Contacta con Bella Home para un nuevo enlace';
    return false;
  }
  try{
    const datos = await apiGet('bella-timeline-datos?pratica_id=' + encodeURIComponent(praticaId) + '&pin=' + encodeURIComponent(pinAcceso));
    const p = datos.pratica;
    if(!p) throw new Error('Expediente no encontrado');
    praticaData = p;
    proprietaData = { codice_proprieta: p.codice_proprieta, titolo_indirizzo: p.proprieta_titolo, referencia_catastral: p.referencia_catastral };
    checklistData = (datos.checklist || []).filter(c => c.per_chi === ruolo || c.per_chi === 'Entrambi');

    const nombre = ruolo === 'Venditore' ? p.venditore_nome : p.acquirente_nome;
    document.getElementById('clientLabel').textContent = ruolo === 'Venditore' ? 'Tu inmueble en venta' : 'Tu nueva propiedad';
    document.getElementById('clientName').textContent = nombre || '—';
    document.getElementById('propertyTitle').textContent = p.proprieta_titolo || '—';
    document.getElementById('propertyRef').textContent = p.codice_proprieta || '';
    document.getElementById('docsSub').textContent = (p.codice_proprieta || '') + ' · ' + (p.proprieta_titolo || '');

    renderJourney();
    renderPersonas();
    return true;
  }catch(e){
    return false;
  }
}

async function intentarAccesoPin(){
  const val = document.getElementById('pinInput').value.trim();
  if(!val) return;
  pinAcceso = val;
  const ok = await init();
  if(ok){
    sessionStorage.setItem('bh_pin_' + praticaId, val);
    document.getElementById('pinGate').style.display = 'none';
  } else {
    document.getElementById('pinError').style.display = 'block';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
}

(async function arrancarAcceso(){
  if(!praticaId || !ruolo){
    await init();
    return;
  }
  const pinGuardado = sessionStorage.getItem('bh_pin_' + praticaId);
  if(pinGuardado){
    pinAcceso = pinGuardado;
    const ok = await init();
    if(ok){ document.getElementById('pinGate').style.display = 'none'; return; }
  }
  document.getElementById('pinInput').focus();
})();

function valorArras(){
  const p = praticaData;
  const oferta = Number(p.offerta_importo) || 0;
  const pct = Number(p.pct_arras) || 10;
  return Math.round(oferta * pct / 100 * 100) / 100;
}

function getSteps(){
  const p = praticaData;
  const docsHechos = checklistData.filter(c => c.stato === 'Caricato' || c.stato === 'Approvato').length;
  const docsTotal = checklistData.length;
  const va = valorArras();
  const reserva = Number(p.importe_reserva) || 0;

  const steps = [
    { key:'aceptada', label:'Oferta aceptada', detail: (money(p.offerta_importo) || '') + (p.fecha_aceptacion ? (' · ' + p.fecha_aceptacion) : ''), done: !!p.offerta_importo, action:'modal' },
    { key:'firma_reserva', label:'Firma de la reserva', detail: p.sin_reserva === 'Si' ? 'Sin reserva (acuerdo directo a arras)' : (money(p.importe_reserva) || ''), done: !!p.reserva_contrato_file || p.sin_reserva === 'Si', action:'modal' },
    { key:'deposito_reserva', label:'Depósito de la reserva', detail: p.sin_reserva === 'Si' ? 'No aplica' : (p.reserva_fecha_deposito || ''), done: !!p.reserva_fecha_deposito || p.sin_reserva === 'Si', action:'modal' },
    { key:'firma_arras', label:'Firma de arras', detail: p.arras_fecha_firma || '', done: !!p.arras_contrato_file, action:'modal' },
    { key:'deposito_arras', label:'Depósito de arras', detail: p.arras_fecha_deposito || '', done: !!p.arras_fecha_deposito, action:'modal' }
  ];

  if(p.reserva_destinatario === 'Agencia'){
    const importeTraspaso = (p.arras_destinatario === 'Agencia') ? va : reserva;
    steps.push({ key:'traspaso', label:'Traspaso de fondos al vendedor', detail: money(importeTraspaso) || '', done: !!p.traspaso_fecha, action:'modal' });
  }

  steps.push(
    { key:'documentos', label:'Documentos necesario', detail: docsTotal ? (docsHechos + ' de ' + docsTotal) : '', done: docsTotal>0 && docsHechos===docsTotal, action:'navigate' },
    { key:'notario', label:'Firma ante notario', detail:'Escritura notarial', done: p.stato === 'Completata', action:'modal', final:true }
  );

  return steps;
}

function renderJourney(){
  const steps = getSteps();
  let currentSet = false;
  const el = document.getElementById('journey');
  el.innerHTML = steps.map((s, i) => {
    let cls = '';
    if(s.done){ cls = 'done'; }
    else if(!currentSet){ cls = 'current'; currentSet = true; }
    if(s.final) cls += ' final';
    return `
      <div class="jstep ${cls}" onclick="onStepClick('${s.key}')">
        <div class="jnode"></div>
        <div class="jlabel">${s.label}</div>
        ${s.detail ? `<div class="jdetail">${s.detail}</div>` : ''}
        <div class="jchevron">›</div>
      </div>
    `;
  }).join('');

  const doneCount = steps.filter(s => s.done).length;
  const fillPct = steps.length > 1 ? (doneCount / (steps.length - 1)) * 100 : 0;
  const fill = document.createElement('div');
  fill.className = 'journey-fill';
  fill.style.height = Math.min(fillPct, 100) + '%';
  el.appendChild(fill);

  const heroKeyImg = document.querySelector('.hero-key');
  if(heroKeyImg){
    const keyEnd = document.createElement('img');
    keyEnd.src = heroKeyImg.src;
    keyEnd.alt = '';
    keyEnd.className = 'journey-key-end';
    el.appendChild(keyEnd);
  }
}

function renderPersonas(){
  const p = praticaData;
  const section = document.getElementById('personasSection');
  const box = document.getElementById('personasLista');

  const filas = [
    { k: 'Agencia', v: p.personas_agencia || 'BELLA HOME' },
    { k: 'Vendedor', v: p.personas_venditore || p.venditore_nome || '' },
    { k: 'Comprador', v: p.personas_comprador || p.acquirente_nome || '' },
    { k: 'Notario', v: p.personas_notario || p.notaio_nome || '' }
  ].filter(f => f.v);

  if(p.note_persone) filas.push({ k: 'Nota', v: p.note_persone });

  let extra = [];
  try{ extra = p.personas_extra_json ? JSON.parse(p.personas_extra_json) : []; }catch(e){ extra = []; }
  extra.forEach(r => { if(r.t && r.v) filas.push({ k: r.t, v: r.v }); });

  if(!filas.length){ section.style.display = 'none'; return; }

  box.innerHTML = filas.map(f => `<div class="persona-fila"><span class="k">${f.k}</span><span class="v">${f.v}</span></div>`).join('');
}

function onStepClick(key){
  const step = getSteps().find(s => s.key === key);
  if(!step) return;
  if(step.action === 'navigate'){ goToDocs(); return; }
  openModal(key);
}

function openModal(key){
  const p = praticaData;
  const titleMap = {
    aceptada: 'Oferta aceptada',
    firma_reserva: 'Firma de la reserva',
    deposito_reserva: 'Depósito de la reserva',
    traspaso: 'Traspaso de fondos al vendedor',
    firma_arras: 'Firma de arras',
    deposito_arras: 'Depósito de arras',
    notario: 'Firma ante notario'
  };
  document.getElementById('modalTitle').textContent = titleMap[key] || '';
  let rows = '';
  let note = '';
  const va = valorArras();
  const reserva = Number(p.importe_reserva) || 0;
  const saldo = Math.max(0, Math.round((va - reserva) * 100) / 100);

  if(key === 'aceptada'){
    rows += row('Precio aceptado', money(p.offerta_importo) || 'Aún no acordado');
    rows += row('Fecha de aceptación', p.fecha_aceptacion || 'Por definir');
    note = p.note_economiche;
  } else if(key === 'firma_reserva'){
    rows += row('Importe de la reserva', money(p.importe_reserva) || 'Por definir');
    rows += row('Destinatario', p.reserva_destinatario || 'Por definir');
    rows += row('Contrato firmado', p.reserva_contrato_file ? 'Aportado ✓' : 'Pendiente');
    note = p.nota_reserva;
  } else if(key === 'deposito_reserva'){
    rows += row('Fecha del depósito', p.reserva_fecha_deposito || 'Pendiente');
    rows += row('Destinatario', p.reserva_destinatario || '—');
    note = p.nota_reserva;
  } else if(key === 'firma_arras'){
    rows += row('Oferta aceptada', money(p.offerta_importo) || '—');
    rows += row('% Arras', (p.pct_arras || 10) + '%');
    rows += row('Valor arras', money(va) || '—');
    rows += row('Destinatario', p.arras_destinatario || 'Por definir');
    note = p.nota_arras;
  } else if(key === 'deposito_arras'){
    rows += row('Valor arras', money(va) || '—');
    rows += row('Reserva entregada', money(reserva) || '—');
    rows += row('Saldo a pagar', money(saldo) || '—');
    rows += row('Destinatario', p.arras_destinatario || '—');
    rows += row('Fecha de depósito', p.arras_fecha_deposito || 'Pendiente');
    note = p.nota_arras;
  } else if(key === 'traspaso'){
    const importeTraspaso = (p.arras_destinatario === 'Agencia') ? va : reserva;
    rows += row('Importe a transferir', money(importeTraspaso) || '—');
    rows += row('Estado', p.traspaso_fecha ? 'Transferido ✓' : 'Pendiente');
    if(p.traspaso_fecha) rows += row('Fecha de la transferencia', p.traspaso_fecha);
  } else if(key === 'notario'){
    rows += row('Estado del expediente', p.stato || '—');
    rows += row('Referencia notarial', p.riferimento_notarile || 'Por asignar');
    note = p.note_notarili;
  }

  document.getElementById('modalBody').innerHTML = rows +
    (note ? `<div class="modal-note"><span class="k">Nota de Bella Home</span>${note}</div>` : '');
  document.getElementById('modalOverlay').classList.add('open');
}
function row(k, v){
  return `<div class="modal-row"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

function renderChecklist(){
  const lista = document.getElementById('lista');
  const punti = checklistData;

  if(!punti.length){
    lista.innerHTML = '<div class="empty">No hay documentos solicitados por el momento.</div>';
    updateRing(0, 0);
    return;
  }

  const hechos = punti.filter(p => p.stato === 'Caricato' || p.stato === 'Approvato').length;
  updateRing(hechos, punti.length);

  lista.innerHTML = punti.map(p => {
    const ok = p.stato === 'Caricato' || p.stato === 'Approvato';
    return `
      <div class="doc-card ${ok ? 'done' : ''}">
        <div class="doc-icon">${ok ? '✓' : '!'}</div>
        <div class="doc-info">
          <strong>${p.nome_punto}</strong>
          ${p.nota ? `<div class="desc">${p.nota}</div>` : (p.descrizione ? `<div class="desc">${p.descrizione}</div>` : '')}
          ${ok && p.file_link ? `<a class="filelink" href="${p.file_link}" target="_blank">Ver documento subido</a>` : ''}
        </div>
        <input type="file" id="upload-${p.id}" style="display:none;" accept=".pdf,.png,.jpg,.jpeg" onchange="carica(${p.id})">
        <button class="doc-btn ${ok ? 'secondary' : ''}" onclick="document.getElementById('upload-${p.id}').click()">${ok ? 'Reemplazar' : 'Subir'}</button>
      </div>
    `;
  }).join('');
}

function updateRing(hechos, total){
  document.getElementById('progressoNum').textContent = hechos + ' / ' + total;
  const pct = total ? Math.round((hechos / total) * 100) : 0;
  document.getElementById('ringPct').textContent = pct + '%';
  const circumference = 150.8;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('ringProgress').style.strokeDashoffset = offset;
}

async function carica(checklistId){
  const input = document.getElementById('upload-' + checklistId);
  if(!input.files.length) return;
  const formData = new FormData();
  formData.append('checklist_id', checklistId);
  formData.append('pratica_id', praticaId);
  formData.append('pin', pinAcceso);
  formData.append('data', input.files[0]);
  showToast('Subiendo...', true);
  try{
    const res = await fetch(baseUrl() + '/webhook/bella-upload-documento', { method: 'POST', body: formData });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    showToast('¡Documento subido, gracias!', true);
    const datos = await apiGet('bella-timeline-datos?pratica_id=' + encodeURIComponent(praticaId) + '&pin=' + encodeURIComponent(pinAcceso));
    checklistData = (datos.checklist || []).filter(c => c.per_chi === ruolo || c.per_chi === 'Entrambi');
    renderChecklist();
  }catch(e){
    showToast('Error al subir: ' + e.message, false);
  }
}
</script>
</body>
</html>
